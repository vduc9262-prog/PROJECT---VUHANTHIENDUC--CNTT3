<body>

    <div class="start">

<div class="container">

    <div class="lesson">
    <h2>Vocabulary Words</h2>

    <button class="Add" id="btn-add">Add New Words</button>
</div>

<div class="main">
    <select name="" id=""class="title">
    <option value=""> All Categories</option><br>
    <option value="Con vật">Con vật</option>
    <option value="Cây cối">Cây cối</option>
</select><br>
    <input type="text" placeholder="Search vocabulary..." id="Search" class="inputSearch">
</div><br>

 
<table class="vocab-table">
  <thead>
    <tr>
      <th>WORD</th>
      <th>MEANING</th>
      <th>CATEGORY</th>
      <th>ACTIONS</th>
    </tr>
  </thead>
  <tbody id="renderWords">

  </tbody>
</table>

</div>

<!-- popup ADd -->
<div class="modal" id="PopAdd" style="display: none">
    <div class="popup">
      <div class="popup-header">
        <h2 id="modalTitle">Add New Word</h2>
        <span class="close-btn" id="closeBtn">&times;</span>
      </div>
      <div class="popup-body">
        <div class="form-group">
          <label for="wordInput">Word</label>
          <input type="text" id="wordInput">
          <small class="error" id="ErrorWord"></small>
        </div>
        <div class="form-group">
          <label for="meaningInput">Meaning</label>
          <input type="text" id="meaningInput" >
          <small class="error" id="ErrorMeaning" ></small>
        </div>
        <div class="form-group">
          <label for="categoryInput">Category</label>
          <select class="Select" name="" id="categoryInput">
            <option value="">Categories</option>
             <option value="animal">animal</option>
             <option value="plant">plant</option>
          </select>
          <small class="error" id="ErrorSelect"></small>
         
        </div>
      </div>
      <div class="popup-footer">
        <button class="btn-cancel" id="cancelBtn">Cancel</button>
        <button class="btn-save" id="saveBtn">Save</button>
      </div>
    </div>
  </div>


<!-- popup Delete -->
  <div class="modal" id="popUpDeleteWord" style="display: none">
    <div class="popupDe">
      <div class="popup-header">
        <h2>Delete Word</h2>
        <span class="close-btn" id="closeDeleteBtn">×</span>
      </div>
      <div class="popup-body">
        Are you sure you want to delete this word?
      </div>
      <div class="popup-footer">
        <button class="btn-cancel" id="cancelDelete">Cancel</button>
        <button class="btn-delete-confirm" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>




       <!-- update popup -->

    <div id="popUpEdit" style="display: none;" class="popUpStyle">
        <div class="modal_box">
            <div class="popUpItem">
                <span>Edit Word</span>
                <button id="close_edit" class="btn-close">X</button>
            </div>
            <hr>
            <div class="popUpItem">
                <label for="editInputWord">Word</label>
                <input type="text" id="editInputWord" class="inputWord">
                <small class="error" id="errorW"></small>
            </div>
            <div class="popUpItem">
                <label for="editInputMeaning">Meaning</label>
                <textarea id="editInputMeaning"></textarea>
                <small class="error" id="errorM"></small>

            </div>
            <div class="popUpItem">
              <label for="">Categories</label> <br>
              <select class="Select" name="" id="editInputCategory">
             <option  >Categories</option>
             <option value="animal">animal</option>
             <option value="plant">plant</option>
          </select>
          <small class="error" id="errorC"></small>
            </div>
            <hr>
            <div class="popUpItem">
                <button id="btn_cancelEditWord" class="btn_cancel">Cancel</button>
                <button id="btn_saveEditWord" class="btn_confirmItem">Save</button>
            </div>
        </div>
    </div>
