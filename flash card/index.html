<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">

</head>
<body>
      <header>
    <div class="start">
        <a href="../homepage/index.html"><b>VocabApp</b></a>
        <a>Dashboard</a>
        <a >Categories</a>
        <a href="../managent vocab word/index.html">Vocabulary</a>
        <a href="../flash card/index.html">Flashcards</a>
        <a href="../quizizz/index.html">Quiz</a>
    </div>
    
    <button class="logout">Logout</button>

  </header>




    <div class="app">
        <!-- Header -->
        <div class="header">
            <h1>Flashcard Learning</h1>
            <select class="lesson-select" id="lesson-select">
                <option value="">Con vật</option>
                <!-- Thêm các bài học khác ở đây -->
            </select>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Flashcard -->
            <div class="flashcard" id="flashcard">
                <div class="card-inner" id="card-inner">
                    <!-- Front -->
                    <div class="card-front">
                        <div class="word" id="front-word">mèo</div>
                    </div>
                    <!-- Back -->
                    <div class="card-back">
                        <div class="word" id="back-meaning">Cat</div>
                    </div>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="controls">
                <button class="btn btn-prev" id="btn-prev">Previous</button>
                <button class="btn btn-learned" id="btn-learned">Mark as Learned</button>
                <button class="btn btn-next" id="btn-next">Next</button>
            </div>

            <!-- Progress -->
            <div class="progress-container">
                <div class="progress-label">
                    <span>Progress</span>
                    <span id="progress-text">0/2</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Word List -->
            <div class="word-list">
                <h2>Word List</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>WORD</th>
                                <th>MEANING</th>
                                <th>STATUS</th>
                            </tr>
                        </thead>
                        <tbody id="word-table-body">
                          
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

</div>

<footer>
     <p>© 2024 VocabApp. All rights reserved</p>
</footer>

    

    <script src="./script.js"></script>
</body>
</html>
